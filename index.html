<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>능주고등학교 - 채용 접수 확인서</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: #ffffff !important;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #e2e8f0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between items-center p-4 sm:p-6 lg:p-10">

    <main class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden print-card border border-slate-200/80 my-auto">
        
        <!-- School Header Banner -->
        <header class="bg-gradient-to-r from-brand-800 via-brand-700 to-navy-900 text-white p-6 sm:p-8 relative">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 rounded-xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white text-2xl font-bold">
                        <i class="fa-solid font-bold fa-school"></i>
                    </div>
                    <div>
                        <span class="text-xs uppercase tracking-widest text-blue-200 font-medium">NEUNGJU HIGH SCHOOL</span>
                        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">능주고등학교</h1>
                    </div>
                </div>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                    접수 완료 (Submitted)
                </span>
            </div>
        </header>

        <div class="p-6 sm:p-10 space-y-8">

            <!-- Confirmation Message Body -->
            <div class="bg-brand-50/50 rounded-xl p-5 sm:p-6 border border-brand-100 text-slate-700 leading-relaxed space-y-4">
                <p class="text-base sm:text-lg font-medium text-slate-800">
                    능주고등학교 채용에 지원해 주셔서 감사드립니다.
                </p>
                <p>
                    제출하신 응시원서가 성공적으로 접수되었습니다.<br>
                    서류 심사 결과 및 향후 전형 일정은 추후 개별 안내해 드릴 예정입니다.
                </p>
                <p>
                    귀한 시간 내어 응시해 주심에 감사드리며, <br> 앞으로 능주고등학교에서 좋은 인연으로 함께 할 수 있기를 진심으로 기대합니다.
                </p>
                <p class="font-semibold text-slate-900 pt-2">
                    감사합니다.
                </p>
            </div>

            <!-- Video Section -->
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-md font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-circle-play text-brand-600"></i> 능주고등학교 홍보영상
                    </h3>
                    <span class="text-xs text-slate-500">* 소리를 들으시려면 영상의 음소거를 해제해 주세요.</span>
                </div>

                <!-- Archive.org MP4 Video Player Container -->
                <div class="relative bg-slate-900 rounded-xl overflow-hidden shadow-md aspect-video flex items-center justify-center">
                    <video 
                        id="videoPlayer" 
                        controls 
                        autoplay 
                        muted 
                        playsinline 
                        preload="metadata"
                        class="w-full h-full object-contain">
                        <!-- 아래 src 속성에 추출하신 Archive.org MP4 파일 직접 링크를 넣으세요 -->
                        <source src="https://archive.org/download/your-identifier/your-video.mp4" type="video/mp4">
                        사용하시는 브라우저는 비디오 태그를 지원하지 않습니다.
                    </video>
                </div>
            </div>

        </div>

    </main>

    <!-- 자동 재생 보장 자바스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('videoPlayer');
            if (video) {
                video.play().catch(error => {
                    console.warn('자동 재생이 실행되지 않았습니다:', error);
                });
            }
        });
    </script>
</body>
</html>
